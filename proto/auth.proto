syntax = "proto3";

package rentix.auth.v1;

option go_package = "github.com/HoanNghi16/rentix-services/proto/authv1;authv1";

// AuthService provides account registration and credential authentication.
// It is intended for calls from the API gateway and other trusted services.
service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc CreateMember(CreateMemberRequest) returns (CreateMemberResponse);
}

message CreateMemberRequest {
  string email = 1;
  string role = 2;
}

message CreateMemberResponse{
  int32 user_id = 1;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

// Registration currently returns success or a gRPC status error.
message RegisterResponse {}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
}
