syntax = "proto3";

service PropertyService{
    rpc GetComplexes(ComplexesRequest) returns ComplexesResponse; //   /property/complexes
}

message Complex{
    int32  id = 1;              
	string name = 2;
	string avatar = 3;
	string address = 4;      
	string ward = 5;   
	string city = 6;      
    int32  total_rooms = 7;
    int32  inactive_rooms = 8;
}

message ComplexesRequest{
    int32 user_id = 1;
    string role = 2;
}

message ComplexesResponse{
    repeated Complex complexes = 1;
}