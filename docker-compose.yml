services:
  rt-auth-db:
    image: postgres:17
    container_name: rt-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rentix_auth
      POSTGRES_USER: rentix
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "5443:5432"
    volumes:
      - rt-auth-data:/var/lib/postgresql
    networks:
      - rentix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentix -d rentix_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
  rt-propety-db:
    image: postgres:17
    container_name: rt-propety-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rentix_propety
      POSTGRES_USER: rentix
      POSTGRES_PASSWORD: ${PROPETY_DB_PASSWORD}
    ports:
      - "5444:5432"
    volumes:
      - rt-propety-data:/var/lib/postgresql
    networks:
      - rentix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentix -d rentix_propety"]
      interval: 5s
      timeout: 5s
      retries: 5
  rt-kafka:
    image: apache/kafka:4.4.0
    container_name: rt-kafka
    hostname: rt-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://rt-kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@rt-kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - rt-kafka-data:/var/lib/kafka/data
    networks:
      - rentix-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
volumes:
  rt-auth-data:
  rt-propety-data:
  rt-kafka-data:

networks:
  rentix-network:
    external: true
